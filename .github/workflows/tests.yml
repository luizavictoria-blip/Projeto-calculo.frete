
name: Testes Automatizados

on:
  push:
    branches:
      - main
      - master
      - github-actions
  pull_request:
    branches:
      - main
      - master

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Executar testes
        run: mvn -B test
